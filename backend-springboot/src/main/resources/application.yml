server:
  port: 8081

spring:
  application:
    name: split-order-fulfillment
  datasource:
    # H2 file database -> data survives restarts. Use ./data/fulfillment locally, /data/fulfillment in Docker.
    url: jdbc:h2:file:${H2_PATH:./data/fulfillment};DB_CLOSE_ON_EXIT=FALSE
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

# ---- Camunda 8 (c8run) connection ------------------------------------------------
camunda:
  client:
    mode: self-managed
    grpc-address: ${CAMUNDA_GRPC_ADDRESS:http://localhost:26500}
    rest-address: ${CAMUNDA_REST_ADDRESS:http://localhost:8080}

app:
  # Orchestration Cluster REST API (v2) used by the custom Tasklist and the live tracker.
  # c8run has no API authentication by default -> leave username/password empty.
  camunda-api:
    base-url: ${CAMUNDA_REST_ADDRESS:http://localhost:8080}
    username: ${CAMUNDA_API_USERNAME:}
    password: ${CAMUNDA_API_PASSWORD:}
    operate-url: ${OPERATE_URL:http://localhost:8080/operate}
  # Built-in mock courier (ShipEngine look-alike). The same key must be set as the
  # connector secret COURIER_API_KEY in the connector runtime.
  courier:
    api-key: ${COURIER_API_KEY:dev-courier-key}
    public-base-url: ${COURIER_PUBLIC_BASE_URL:http://localhost:8081}
  fulfillment:
    # ISO-8601 duration used by the timer boundary event on the substitution sub-process
    substitution-timeout: ${SUBSTITUTION_TIMEOUT:PT5M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.fashionhub: INFO
    io.camunda.client: INFO
